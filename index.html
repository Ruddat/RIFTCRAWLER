<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="RIFT CRAWLER – Ein Roguelike Dungeon Crawler als HTML5 Game">
  <meta name="theme-color" content="#0a0a14">
  <title>RIFT CRAWLER</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    // Compatibility guard for older renderer code paths that still use globals.
    var NEON_PURPLE = '#b44dff';
    var KNOCKBACK_FORCE = 200;
    var KNOCKBACK_DURATION = 0.15;
    var playSfx = function (...args) {
      if (window.__audio && typeof window.__audio.playSfx === 'function') {
        return window.__audio.playSfx(...args);
      }
    };
  </script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/sprite-overlay-autoload.js"></script>
</body>
</html>
